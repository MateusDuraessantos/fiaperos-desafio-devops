name: CI/CD - Greenhouse API

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches: [dev, main]

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:

  build:
    name: Build, BDD and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'BddSqlOnly@2026!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd="SQLCMDPASSWORD='BddSqlOnly@2026!' /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=20 --health-start-period=20s

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restaurar dependências
        run: dotnet restore Greenhouse.sln

      - name: Build da aplicação
        run: dotnet build Greenhouse.sln --configuration Release --no-restore

      - name: Executar unitários e BDD com SQL Server e verificar cobertura das APIs
        env:
          # Credencial exclusiva do serviço descartável de testes, sem acesso ao Azure.
          BDD_SQLSERVER_CONNECTION: 'Server=localhost,1433;Database=master;User Id=sa;Password=BddSqlOnly@2026!;TrustServerCertificate=True;Connect Timeout=10'
        run: python scripts/test_bdd.py --no-build --provider sqlserver

      - name: Salvar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/sqlserver/
          if-no-files-found: error

      - name: Build da imagem Docker
        run: docker build -t greenhouse-api:test ./src/Greenhouse.API

      - name: Publicar aplicação
        run: dotnet publish ./src/Greenhouse.API/Greenhouse.API.csproj --configuration Release --no-build --no-restore --output ./publish

      - name: Identificar ambiente no pacote publicado
        env:
          DEPLOYMENT_BRANCH: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          environments = {
              "refs/heads/dev": "Staging",
              "refs/heads/main": "Production",
          }
          environment = environments.get(os.environ["DEPLOYMENT_BRANCH"], "Unknown")
          path = Path("publish/appsettings.json")
          settings = json.loads(path.read_text(encoding="utf-8-sig"))
          settings["Deployment"] = {"Environment": environment}
          path.write_text(json.dumps(settings, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: greenhouse-api
          path: ./publish


  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'

    steps:
      - name: Baixar aplicação
        uses: actions/download-artifact@v4
        with:
          name: greenhouse-api
          path: ./publish

      - name: Deploy no Azure - Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: greenhouse-staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./publish


  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar aplicação
        uses: actions/download-artifact@v4
        with:
          name: greenhouse-api
          path: ./publish

      - name: Deploy no Azure - Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: greenhouse-production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: ./publish
