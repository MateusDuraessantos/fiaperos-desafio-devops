name: CI/CD - Greenhouse API

on:
  push:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:

  # =====================================================
  # 1 - BUILD, TESTES E VALIDAÇÃO DO DOCKER
  # =====================================================
  build:
    name: Build, Test and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore ./tests/Greenhouse.API.Tests/Greenhouse.API.Tests.csproj

      - name: Build da aplicação
        run: dotnet build ./tests/Greenhouse.API.Tests/Greenhouse.API.Tests.csproj --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test ./tests/Greenhouse.API.Tests/Greenhouse.API.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory ./test-results

      - name: Confirmar que testes reais foram executados
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("test-results/tests.trx").getroot()
          counters = root.find(".//{*}Counters")
          if counters is None or int(counters.get("executed", "0")) == 0:
              raise SystemExit("Nenhum teste foi executado.")
          PY

      - name: Salvar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx
          if-no-files-found: error

      # Valida se o Dockerfile consegue gerar a imagem
      - name: Build da imagem Docker
        run: docker build -t greenhouse-api:test ./src/Greenhouse.API

      - name: Publicar aplicação
        run: dotnet publish ./src/Greenhouse.API/Greenhouse.API.csproj --configuration Release --no-build --no-restore --output ./publish

      - name: Identificar ambiente no pacote publicado
        env:
          DEPLOYMENT_BRANCH: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          environments = {
              "refs/heads/dev": "Staging",
              "refs/heads/main": "Production",
          }
          environment = environments.get(os.environ["DEPLOYMENT_BRANCH"], "Unknown")
          path = Path("publish/appsettings.json")
          settings = json.loads(path.read_text(encoding="utf-8-sig"))
          settings["Deployment"] = {"Environment": environment}
          path.write_text(json.dumps(settings, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: greenhouse-api
          path: ./publish


  # =====================================================
  # 2 - DEPLOY STAGING
  # =====================================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Baixar aplicação
        uses: actions/download-artifact@v4
        with:
          name: greenhouse-api
          path: ./publish

      - name: Deploy no Azure - Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: greenhouse-staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./publish


  # =====================================================
  # 3 - DEPLOY PRODUÇÃO
  # =====================================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Baixar aplicação
        uses: actions/download-artifact@v4
        with:
          name: greenhouse-api
          path: ./publish

      - name: Deploy no Azure - Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: greenhouse-production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: ./publish
