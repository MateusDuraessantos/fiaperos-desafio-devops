name: CI/CD - Greenhouse API

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:

  # =====================================================
  # 1 - BUILD, TESTES E VALIDAÇÃO DO DOCKER
  # =====================================================
  build:
    name: Build, Test and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build da aplicação
        run: dotnet build --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test --configuration Release --no-build

      # Valida se o Dockerfile consegue gerar a imagem
      - name: Build da imagem Docker
        run: docker build -t greenhouse-api:test .

      - name: Publicar aplicação
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: greenhouse-api
          path: ./publish


  # =====================================================
  # 2 - DEPLOY STAGING
  # =====================================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Baixar aplicação
        uses: actions/download-artifact@v4
        with:
          name: greenhouse-api
          path: ./publish

      - name: Deploy no Azure - Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: greenhouse-staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./publish


  # =====================================================
  # 3 - DEPLOY PRODUÇÃO
  # =====================================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Baixar aplicação
        uses: actions/download-artifact@v4
        with:
          name: greenhouse-api
          path: ./publish

      - name: Deploy no Azure - Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: greenhouse-production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: ./publish